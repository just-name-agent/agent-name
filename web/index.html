<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NULL SOCIETY — Genesis Trial (accelerated replay)</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #0b0e14; color: #e8ecf1; }
  #app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #view { position: relative; }
  #c { width: 100%; height: 100%; display: block; }
  #banner { position: absolute; top: 8px; left: 8px; background: #f5a623; color: #111;
    padding: 4px 10px; border-radius: 4px; font-weight: 700; }
  #controls { position: absolute; bottom: 10px; left: 10px; right: 10px;
    background: rgba(10,14,20,.85); padding: 8px 12px; border-radius: 6px; }
  #controls input[type=range] { width: 60%; vertical-align: middle; }
  #side { background: #11151d; padding: 12px; overflow-y: auto; }
  .bar { height: 8px; background: #333; border-radius: 4px; margin: 2px 0 8px; }
  .bar > div { height: 100%; border-radius: 4px; background: #4ade80; }
  .agent { cursor: pointer; padding: 6px; border-radius: 4px; }
  .agent.sel { background: #1e293b; }
  .portrait { width: 48px; height: 48px; border-radius: 6px; vertical-align: middle; margin-right: 8px; }
  #timeline li.fail { color: #f87171; }
  #timeline li.build { color: #4ade80; }
  #timeline li.vote { color: #93c5fd; }
  h2 { font-size: 15px; margin: 14px 0 6px; color: #9fb3c8; text-transform: uppercase; }
  button { background: #2563eb; color: #fff; border: 0; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="banner">ACCELERATED REPLAY — 1 day = 1 min (not live)</div>
    <div id="controls">
      <button id="play">Play</button>
      <input id="day" type="range" min="1" max="7" step="1" value="1">
      <span id="daylabel">Day 1 / 7</span>
      <span id="runinfo"></span>
    </div>
  </div>
  <div id="side">
    <h2>Society</h2>
    <div id="dash"></div>
    <h2>Robots (click to inspect)</h2>
    <div id="agents"></div>
    <h2>Profile</h2>
    <div id="profile">Select a robot.</div>
    <h2>Timeline</h2>
    <ul id="timeline"></ul>
  </div>
</div>
<script type="importmap">
{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
             "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
